name: handflow
version: "0.1.0"
description: >
  Handflow — a Manus-style planning flow, native to Hermes. The agent writes a
  step plan before it starts, marks each step in_progress / completed / blocked
  with a note as it works, and replans mid-flight; a dockable desktop pane shows
  the same plan live, and you can toggle a step from the pane. One stdlib-only
  tool (`handflow`) plus backend routes; state is plain JSON under $HERMES_HOME,
  no model calls and no network of its own. Flow design ported from OpenManus's
  PlanningFlow (MIT).
author: "Ritesh Patel (DECRUX9812)"
license: MIT
homepage: https://github.com/DECRUX9812/hermes-handflow
kind: standalone
requires_hermes: ">=0.19"
platforms:
  - linux
  - macos
tags:
  - planning
  - agent-flow
  - tasks
  - desktop
provides_tools:
  - handflow
provides_hooks: []
provides_middleware: []
requires_env: []
config_schema:
  state_dir:
    type: string
    default: ""
    description: >
      Where plan JSON lives. Empty means $HERMES_HOME/handflow, which is what you
      want unless you deliberately want plans shared across profiles.
  plan_scope:
    type: string
    default: profile
    description: >
      Which sessions share an active plan. "profile" (default): one per profile.
      "session": one per Hermes session. "project": one per git checkout of the
      session's working directory, so subagents and Kanban workers in the same
      worktree share the plan; sessions outside a git checkout fall back to
      "session". HANDFLOW_SCOPE in the environment overrides this.
  pane_refresh_ms:
    type: integer
    default: 2000
    description: How often the desktop pane re-reads the active plan.
